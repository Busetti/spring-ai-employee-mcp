spring.application.name=employee-mcp-server

# H2 file-based database for persisting dynamic tool configurations
spring.datasource.url=jdbc:h2:file:./data/dynamic-tools;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
server.port=8082

# MCP Server configuration
spring.ai.mcp.server.name=employee-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.annotation-scanner.enabled=true

# Employee service base URL
employee.service.base-url=http://localhost:8081

# Dynamic tool registration settings
# Rate limit: 20 registrations per 60 seconds per IP (see RegistrationRateLimiter)
# SSRF guard: loopback, link-local, private ranges, and cloud metadata IPs are blocked (see SsrfGuard)
# Tool name regex: ^[a-zA-Z][a-zA-Z0-9_-]{1,63}$
# Supported HTTP methods: GET, POST, PUT, PATCH, DELETE
# Max tool timeout: 60 seconds (clamped in DynamicToolCallbackFactory)

# Trusted hosts that bypass SSRF checks (comma-separated).
# Add internal service hostnames here for dev/staging environments.
dynamic.tool.ssrf.trusted-hosts=localhost,127.0.0.1
